stages:
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_engine_strict: "false"
  CI: "1"
  EAS_NO_VCS: "1"

android_apk:
  stage: build
  image: node:20.19.6-bookworm-slim
  interruptible: true
  resource_group: flamingo-passenger-android

  before_script:
    - apt-get update
    - apt-get install -y git
    - mkdir -p ci-logs artifacts
    - npm install -g eas-cli@latest
    - npm ci

  script:
    - export EXPO_TOKEN="${EXPO_TOKEN:-$EAS_TOKEN}"

    - |
      if [ -z "$EXPO_TOKEN" ]; then
        echo "ERROR: EXPO_TOKEN is missing"
        exit 1
      fi

    - eas whoami

    - eas build --platform android --profile preview --non-interactive --wait --json > ci-logs/eas-result.json

    - node scripts/ci/download-eas-artifact.mjs ci-logs/eas-result.json artifacts/flaminGO-passenger.apk

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/
      - ci-logs/
