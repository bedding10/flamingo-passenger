# ---------------------------------------------------------------------------
# flaminGO Passenger - DEVELOPMENT pipeline
#
# During development we want ONE thing only:
#   every push -> one "build" job -> installable Android APK artifact.
#
# No lint / typecheck / expo-doctor / quality-gate / release-validate / prebuild
# runs here. None of those tools or scripts are deleted: quality-gate.mjs,
# require-env.mjs, validate-release.mjs and every package.json script stay in the
# repo untouched, ready for the production pipeline. They are simply NOT invoked
# by this dev pipeline.
#
# Production settings (AAB / Google Play) are preserved below as a disabled job
# (rules: when: never). Re-enable them later by swapping the rule back to
# `- if: '$CI_COMMIT_BRANCH == "main"'` (see the commented block).
#
# The actual Android build runs on EAS Build (Expo cloud); this runner only
# triggers the build, waits, and downloads the APK, so no Android SDK is needed.
# ---------------------------------------------------------------------------

stages:
  - build

# A pipeline runs on every push (any branch) and on manual/web runs.
# Merge-request pipelines are disabled to avoid duplicate builds.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always

variables:
  npm_config_audit: "false"
  npm_config_fund: "false"
  # eas.json requires eas-cli >=21.0.3, newer than the app's Node 20 engine pin;
  # relax engine-strict just for the global CLI install on the runner.
  npm_config_engine_strict: "false"
  CI: "1"

# ===========================================================================
# ACTIVE (development): the ONLY job that runs on push. Builds an APK.
# ===========================================================================
android_apk:
  stage: build
  image: node:20.19.6-bookworm-slim
  interruptible: true
  # Serialize EAS builds so concurrent pushes don't collide on the same project.
  resource_group: flamingo-passenger-android
  before_script:
    - mkdir -p ci-logs artifacts
    # Only the EAS CLI is needed to trigger a cloud build (not the full app deps).
    - npm install --global eas-cli@latest 2>&1 | tee ci-logs/eas-cli-install.log
  script:
    # Accept either EXPO_TOKEN or EAS_TOKEN as the Expo access token.
    - export EXPO_TOKEN="${EXPO_TOKEN:-$EAS_TOKEN}"
    # Fail fast with a clear message if no Expo token is configured.
    - |
      if [ -z "${EXPO_TOKEN:-}" ]; then
        echo "ERROR: neither EXPO_TOKEN nor EAS_TOKEN is set."
        echo "Add EXPO_TOKEN in GitLab > Settings > CI/CD > Variables"
        echo "(mark it as NOT protected, or protect the branch you push to)."
        exit 1
      fi
    # Verify the token is valid; stop the pipeline immediately if it is not.
    - echo "Checking Expo authentication..."
    - |
      if ! eas whoami; then
        echo "ERROR: eas whoami failed - the Expo token is missing or invalid."
        echo "Check the EXPO_TOKEN (or EAS_TOKEN) CI/CD variable."
        exit 1
      fi
    # profile "preview" is configured in eas.json to output buildType: apk.
    # stderr is NOT redirected, so any EAS error shows directly in the GitLab log.
    - eas build --platform android --profile preview --non-interactive --wait --json 1> ci-logs/eas-result.json
    # Download the finished APK from the EAS artifact URL into artifacts/.
    - node scripts/ci/download-eas-artifact.mjs ci-logs/eas-result.json artifacts/flaminGO-passenger.apk
  artifacts:
    name: "flaminGO-passenger-apk-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - artifacts/
      - ci-logs/

# ===========================================================================
# PRESERVED but DISABLED (production). Kept intact for the future production
# pipeline; NOT deleted. It never runs today because of `rules: when: never`.
#
# To re-enable production AAB builds later, replace the `rules` block below with:
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "main"'
# (and provide the protected CI variables checked by scripts/ci/require-env.mjs:
#  EAS_PROJECT_ID, EXPO_PUBLIC_API_URL, GOOGLE_MAPS_ANDROID_API_KEY,
#  GOOGLE_MAPS_IOS_API_KEY, EXPO_TOKEN/EAS_TOKEN).
# ===========================================================================
android_production_build:
  stage: build
  image: node:20.19.6-bookworm-slim
  resource_group: flamingo-passenger-android
  rules:
    - when: never   # disabled during development
  before_script:
    - mkdir -p ci-logs artifacts .npm
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - npm install --global npm@10.8.2 2>&1 | tee "ci-logs/${CI_JOB_NAME}-npm-bootstrap.log"
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    EAS_PROFILE: "production"
    ARTIFACT_NAME: "flaminGO-passenger-production.aab"
  script:
    - npm ci --prefer-offline 2>&1 | tee "ci-logs/${CI_JOB_NAME}-npm-ci.log"
    - node scripts/ci/require-env.mjs android-build
    - export EXPO_TOKEN="${EXPO_TOKEN:-$EAS_TOKEN}"
    - FLAMINGO_REQUIRE_NATIVE_CONFIG=1 npx --no-install eas build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json 2> "ci-logs/${CI_JOB_NAME}-eas.stderr.log" | tee "ci-logs/${CI_JOB_NAME}-eas-result.json"
    - node scripts/ci/download-eas-artifact.mjs "ci-logs/${CI_JOB_NAME}-eas-result.json" "artifacts/$ARTIFACT_NAME"
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-logs/
      - artifacts/
